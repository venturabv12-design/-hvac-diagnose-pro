<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1188" viewBox="0 0 1120 1188" font-family="ui-sans-serif,system-ui,Arial,sans-serif"><rect x="0" y="0" width="1120" height="1188" fill="#ffffff"/><metadata data-conns="COMP/R|RUNCAP/HERM;CONT/21|OFM/BRN;OFM/YEL|RUNCAP/FAN;PWR/L1|CONT/11"></metadata><rect x="24" y="116" width="1072" height="480" rx="14" fill="#fdf4f3"/><rect x="24" y="612" width="1072" height="252" rx="14" fill="#f0f8f6"/><text x="40" y="34" font-size="21" font-weight="800" fill="#0b0d10">Comfortmaker 146SAN — how it’s wired</text><text x="40" y="53" font-size="12.5" fill="#7a8390">A beginner-friendly map of the real parts and how the wires connect them. The real manual is one tap away.</text><text x="44" y="138" font-size="14" font-weight="800" fill="#d92b1c">HIGH VOLTAGE · 240V</text><text x="214" y="138" font-size="11" fill="#b06a62">— the power that actually runs the compressor &amp; fan</text><text x="44" y="628" font-size="14" font-weight="800" fill="#0f8a7e">LOW VOLTAGE · 24V</text><text x="205" y="628" font-size="11" fill="#5a9089">— the small signal from inside that switches it on</text><path d="M 162.0 258.0 L 180.0 258.0 L 150.0 258.0 L 150.0 258.0 L 192.0 258.0 L 210.0 258.0" fill="none" stroke="#ffffff" stroke-width="7" opacity="0.95" stroke-linejoin="round" stroke-linecap="round"/><path data-conn="PWR/L1|CONT/11" d="M 162.0 258.0 L 180.0 258.0 L 150.0 258.0 L 150.0 258.0 L 192.0 258.0 L 210.0 258.0" fill="none" stroke="#d92b1c" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round"/><path d="M 398.0 258.0 L 426.0 258.0 L 606.4 258.0 L 606.4 440.0 L 877.0 440.0 L 905.0 440.0" fill="none" stroke="#ffffff" stroke-width="7" opacity="0.95" stroke-linejoin="round" stroke-linecap="round"/><path data-conn="CONT/21|OFM/BRN" d="M 398.0 258.0 L 426.0 258.0 L 606.4 258.0 L 606.4 440.0 L 877.0 440.0 L 905.0 440.0" fill="none" stroke="#7a4a1e" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round"/><path d="M 905.0 460.0 L 867.0 460.0 L 782.0 460.0 L 782.0 327.0 L 654.5 327.0 L 654.5 365.0" fill="none" stroke="#ffffff" stroke-width="7" opacity="0.95" stroke-linejoin="round" stroke-linecap="round"/><path data-conn="OFM/YEL|RUNCAP/FAN" d="M 905.0 460.0 L 867.0 460.0 L 782.0 460.0 L 782.0 327.0 L 654.5 327.0 L 654.5 365.0" fill="none" stroke="#e6b400" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round"/><path d="M 899.0 240.0 L 851.0 240.0 L 825.1 240.0 L 825.1 317.0 L 591.5 317.0 L 591.5 365.0" fill="none" stroke="#ffffff" stroke-width="7" opacity="0.95" stroke-linejoin="round" stroke-linecap="round"/><path data-conn="COMP/R|RUNCAP/HERM" d="M 899.0 240.0 L 851.0 240.0 L 825.1 240.0 L 825.1 317.0 L 591.5 317.0 L 591.5 365.0" fill="none" stroke="#1c1f26" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round"/><g data-part="PWR"><rect x="44.0" y="196.0" width="118" height="104" rx="8" fill="#4a5058" stroke="#11141a" stroke-width="2.2"/><rect x="54.0" y="208.0" width="98" height="26" rx="3" fill="#2b2f37"/><rect x="94.0" y="212.0" width="18" height="18" rx="2" fill="#c9ced6" stroke="#11141a" stroke-width="1.4"/><text x="103.0" y="254.0" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">DISCONNECT</text><text x="103.0" y="270.0" text-anchor="middle" font-size="9" fill="#c9ced6">pull to kill power</text><text x="103.0" y="186.0" text-anchor="middle" font-size="10" font-weight="700" fill="#0b0d10">240V from panel</text><line x1="89.0" y1="196.0" x2="89.0" y2="190.0" stroke="#d92b1c" stroke-width="3"/><line x1="117.0" y1="196.0" x2="117.0" y2="190.0" stroke="#d92b1c" stroke-width="3"/><circle cx="162.0" cy="258.0" r="7.5" fill="#c9ced6" stroke="#11141a" stroke-width="1.6"/><line x1="158.0" y1="258.0" x2="166.0" y2="258.0" stroke="#11141a" stroke-width="1.4"/></g><g data-part="CONT"><rect x="210.0" y="176.0" width="188" height="164" rx="12" fill="#23262d" stroke="#0c0e12" stroke-width="2"/><rect x="213.0" y="179.0" width="182" height="158" rx="10" fill="none" stroke="#3a3f47" stroke-width="1"/><rect x="240.0" y="184.0" width="128" height="16" rx="4" fill="#8b929c" stroke="#5b616b" stroke-width="1"/><rect x="290.0" y="187.0" width="28" height="10" rx="3" fill="#c9ced6"/><text x="304.0" y="218.0" text-anchor="middle" font-size="15" font-weight="800" fill="#e8ecf2">CONTACTOR</text><text x="304.0" y="231.0" text-anchor="middle" font-size="8.5" fill="#9aa3b2">the switch that powers the unit on</text><text x="222.0" y="246.0" font-size="8" font-weight="700" fill="#8b929c">LINE</text><text x="386.0" y="246.0" text-anchor="end" font-size="8" font-weight="700" fill="#8b929c">LOAD</text><line x1="216.0" y1="258.0" x2="280.0" y2="258.0" stroke="#e8ecf2" stroke-width="2.6" stroke-linecap="round"/><circle cx="280.0" cy="258.0" r="3.2" fill="#e8ecf2"/><line x1="280.0" y1="258.0" x2="300.0" y2="246.0" stroke="#e8ecf2" stroke-width="2.6" stroke-linecap="round"/><circle cx="304.0" cy="258.0" r="3.2" fill="#e8ecf2"/><line x1="304.0" y1="258.0" x2="392.0" y2="258.0" stroke="#e8ecf2" stroke-width="2.6" stroke-linecap="round"/><text x="304.0" y="242.0" text-anchor="middle" font-size="7.5" fill="#9aa3b2">switched</text><line x1="216.0" y1="288.0" x2="392.0" y2="288.0" stroke="#e8ecf2" stroke-width="2.6" stroke-linecap="round"/><text x="304.0" y="300.0" text-anchor="middle" font-size="7.5" fill="#e0a24a">always hot (unswitched leg)</text><rect x="246.0" y="302.0" width="116" height="26" rx="6" fill="#0f8a7e" fill-opacity="0.20" stroke="#0f8a7e" stroke-width="1.5"/><text x="304.0" y="318.0" text-anchor="middle" font-size="9.5" font-weight="800" fill="#0f8a7e">24V COIL</text><path d="M 266.0 336.0 Q 272.0 332.0 278.0 336.0 Q 284.0 332.0 290.0 336.0 Q 296.0 332.0 302.0 336.0 Q 308.0 332.0 314.0 336.0 Q 320.0 332.0 326.0 336.0 Q 332.0 332.0 338.0 336.0" fill="none" stroke="#0f8a7e" stroke-width="1.8" opacity="0.7"/><line x1="292.0" y1="261.0" x2="304.0" y2="302.0" stroke="#0f8a7e" stroke-width="1.3" stroke-dasharray="3 3" opacity="0.8"/><circle cx="210.0" cy="258.0" r="7.5" fill="#c9ced6" stroke="#11141a" stroke-width="1.6"/><line x1="206.0" y1="258.0" x2="214.0" y2="258.0" stroke="#11141a" stroke-width="1.4"/><rect x="186.0" y="252.0" width="20.1" height="15.0" rx="3" fill="#ffffff" opacity="0.92"/><text x="196.0" y="262.0" text-anchor="middle" font-size="11" font-weight="700" fill="#0b0d10">L1</text><circle cx="398.0" cy="258.0" r="7.5" fill="#c9ced6" stroke="#11141a" stroke-width="1.6"/><line x1="394.0" y1="258.0" x2="402.0" y2="258.0" stroke="#11141a" stroke-width="1.4"/><rect x="402.0" y="252.0" width="20.1" height="15.0" rx="3" fill="#ffffff" opacity="0.92"/><text x="412.0" y="262.0" text-anchor="middle" font-size="11" font-weight="700" fill="#0b0d10">T1</text></g><g data-part="COMP"><circle cx="954.0" cy="240.0" r="54" fill="#3a3f47" stroke="#11141a" stroke-width="2.6"/><circle cx="954.0" cy="240.0" r="46" fill="none" stroke="#565c66" stroke-width="1.5"/><text x="954.0" y="232.0" text-anchor="middle" font-size="15" font-weight="800" fill="#e8ecf2">COMPRESSOR</text><text x="954.0" y="248.0" text-anchor="middle" font-size="9" fill="#9aa3b2">pumps the</text><text x="954.0" y="260.0" text-anchor="middle" font-size="9" fill="#9aa3b2">refrigerant</text><circle cx="899.0" cy="240.0" r="5.5" fill="#c9ced6" stroke="#11141a" stroke-width="1.5"/><rect x="879.5" y="234.0" width="13.0" height="15.0" rx="3" fill="#ffffff" opacity="0.92"/><text x="886.0" y="244.0" text-anchor="middle" font-size="11" font-weight="700" fill="#0b0d10">R</text></g><g data-part="OFM"><circle cx="954.0" cy="452.0" r="48" fill="#eef1f5" stroke="#11141a" stroke-width="2.3"/><path d="M 954.0 452.0 Q 983.5 468.1 990.0 452.0 Z" fill="#c4ccd6" stroke="#8a94a6" stroke-width="1"/><path d="M 954.0 452.0 Q 925.3 469.5 936.0 483.2 Z" fill="#c4ccd6" stroke="#8a94a6" stroke-width="1"/><path d="M 954.0 452.0 Q 953.2 418.4 936.0 420.8 Z" fill="#c4ccd6" stroke="#8a94a6" stroke-width="1"/><circle cx="954.0" cy="452.0" r="8" fill="#565c66"/><text x="954.0" y="516.0" text-anchor="middle" font-size="13" font-weight="800" fill="#0b0d10">FAN MOTOR</text><text x="954.0" y="530.0" text-anchor="middle" font-size="9.5" fill="#66707d">spins to cool the coil</text><circle cx="905.0" cy="440.0" r="5.5" fill="#c9ced6" stroke="#11141a" stroke-width="1.5"/><circle cx="905.0" cy="460.0" r="5.5" fill="#c9ced6" stroke="#11141a" stroke-width="1.5"/></g><g data-part="RUNCAP"><rect x="560.0" y="380.0" width="126" height="98" rx="30" fill="#eef1f5" stroke="#11141a" stroke-width="2.2"/><text x="623.0" y="448.0" text-anchor="middle" font-size="12" font-weight="800" fill="#0b0d10">RUN CAPACITOR</text><text x="623.0" y="462.0" text-anchor="middle" font-size="8.5" fill="#66707d">helps the motors</text><text x="623.0" y="473.0" text-anchor="middle" font-size="8.5" fill="#66707d">start &amp; run smoothly</text><rect x="584.5" y="365.0" width="14" height="16" rx="2" fill="#b9bfc9" stroke="#11141a" stroke-width="1.4"/><rect x="574.4" y="337.0" width="34.2" height="15.0" rx="3" fill="#ffffff" opacity="0.92"/><text x="591.5" y="347.0" text-anchor="middle" font-size="11" font-weight="700" fill="#0b0d10">HERM</text><rect x="647.5" y="365.0" width="14" height="16" rx="2" fill="#b9bfc9" stroke="#11141a" stroke-width="1.4"/><rect x="640.9" y="337.0" width="27.1" height="15.0" rx="3" fill="#ffffff" opacity="0.92"/><text x="654.5" y="347.0" text-anchor="middle" font-size="11" font-weight="700" fill="#0b0d10">FAN</text></g><circle cx="171.0" cy="258.0" r="8.5" fill="#ffffff" stroke="#d92b1c" stroke-width="2"/><text x="171.0" y="261.5" text-anchor="middle" font-size="10" font-weight="800" fill="#0b0d10">1</text><circle cx="741.7" cy="440.0" r="8.5" fill="#ffffff" stroke="#7a4a1e" stroke-width="2"/><text x="741.7" y="443.5" text-anchor="middle" font-size="10" font-weight="800" fill="#0b0d10">2</text><circle cx="782.0" cy="393.5" r="8.5" fill="#ffffff" stroke="#e6b400" stroke-width="2"/><text x="782.0" y="397.0" text-anchor="middle" font-size="10" font-weight="800" fill="#0b0d10">3</text><circle cx="708.3" cy="317.0" r="8.5" fill="#ffffff" stroke="#1c1f26" stroke-width="2"/><text x="708.3" y="320.5" text-anchor="middle" font-size="10" font-weight="800" fill="#0b0d10">4</text><rect x="24" y="896.0" width="1072" height="288" rx="12" fill="#f6f7f9" stroke="#e4e7ec" stroke-width="1"/><line x1="772" y1="912.0" x2="772" y2="1172.0" stroke="#e0e4e9" stroke-width="1"/><text x="40" y="920.0" font-size="14" font-weight="800" fill="#0b0d10">WHAT EACH WIRE DOES</text><text x="234" y="920.0" font-size="10" fill="#8a94a6">match a wire’s number on the drawing · ● = wires joined</text><circle cx="48.0" cy="945.0" r="8" fill="#ffffff" stroke="#d92b1c" stroke-width="2"/><text x="48.0" y="948.5" text-anchor="middle" font-size="10" font-weight="800" fill="#0b0d10">1</text><line x1="62.0" y1="945.0" x2="86.0" y2="945.0" stroke="#d92b1c" stroke-width="5" stroke-linecap="round"/><text x="96.0" y="949.0" font-size="9.5" fill="#333a42">One leg of 240-volt power to contactor line side.</text><circle cx="414.0" cy="945.0" r="8" fill="#ffffff" stroke="#7a4a1e" stroke-width="2"/><text x="414.0" y="948.5" text-anchor="middle" font-size="10" font-weight="800" fill="#0b0d10">2</text><line x1="428.0" y1="945.0" x2="452.0" y2="945.0" stroke="#7a4a1e" stroke-width="5" stroke-linecap="round"/><text x="462.0" y="949.0" font-size="9.5" fill="#333a42">Contactor load side feeds outdoor fan motor.</text><circle cx="48.0" cy="969.0" r="8" fill="#ffffff" stroke="#e6b400" stroke-width="2"/><text x="48.0" y="972.5" text-anchor="middle" font-size="10" font-weight="800" fill="#0b0d10">3</text><line x1="62.0" y1="969.0" x2="86.0" y2="969.0" stroke="#e6b400" stroke-width="5" stroke-linecap="round"/><text x="96.0" y="973.0" font-size="9.5" fill="#333a42">Outdoor fan motor run winding to fan side of run…</text><circle cx="414.0" cy="969.0" r="8" fill="#ffffff" stroke="#1c1f26" stroke-width="2"/><text x="414.0" y="972.5" text-anchor="middle" font-size="10" font-weight="800" fill="#0b0d10">4</text><line x1="428.0" y1="969.0" x2="452.0" y2="969.0" stroke="#1c1f26" stroke-width="5" stroke-linecap="round"/><text x="462.0" y="973.0" font-size="9.5" fill="#333a42">Compressor run terminal wired to run-cap HERM tap.</text><text x="792" y="920.0" font-size="14" font-weight="800" fill="#0b0d10">WHAT THE LETTERS MEAN</text><text x="792" y="948.0" font-size="10.5" font-weight="800" fill="#0f5a52">L1 / L2</text><text x="890" y="948.0" font-size="10" fill="#4a5058">the two 240-volt power legs in</text><text x="792" y="972.0" font-size="10.5" font-weight="800" fill="#0f5a52">T1 / T2</text><text x="890" y="972.0" font-size="10" fill="#4a5058">power leaving the contactor</text><text x="792" y="996.0" font-size="10.5" font-weight="800" fill="#0f5a52">C · R · S</text><text x="890" y="996.0" font-size="10" fill="#4a5058">compressor: Common / Run / Start</text><text x="792" y="1020.0" font-size="10.5" font-weight="800" fill="#0f5a52">HERM</text><text x="890" y="1020.0" font-size="10" fill="#4a5058">capacitor → compressor (“hermetic”)</text><text x="792" y="1044.0" font-size="10.5" font-weight="800" fill="#0f5a52">FAN</text><text x="890" y="1044.0" font-size="10" fill="#4a5058">capacitor → the fan motor</text><text x="792" y="1068.0" font-size="10.5" font-weight="800" fill="#0f5a52">LPS · HPS</text><text x="890" y="1068.0" font-size="10" fill="#4a5058">low / high-pressure safety switch</text><text x="792" y="1092.0" font-size="10.5" font-weight="800" fill="#0f5a52">DTS · CTD</text><text x="890" y="1092.0" font-size="10" fill="#4a5058">discharge-temp switch · time-delay</text><text x="792" y="1122.0" font-size="9.5" font-style="italic" fill="#8a94a6">“C” = Common everywhere — but a different wire each place.</text></svg>